name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db

  accounting-api-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify accounting_api.py matches TAKE_HOME.md exactly
        run: |
          awk '/^```python$/{f=1;next}/^```$/{f=0}f' TAKE_HOME.md > /tmp/expected_api.py
          diff /tmp/expected_api.py accounting_api.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all services
        run: docker compose build
